# =============================================================================
# Reusable workflow — publish the built site (dist artifact) to ONE environment
#
# Cache strategy:
#   _astro/*      content-hashed file names → cached for 1 year (immutable)
#   everything    HTML and un-hashed assets → browsers always revalidate,
#   else          CloudFront keeps them 1 day (s-maxage) until invalidated
#
# Upload order avoids broken pages during a deploy: new hashed assets first,
# then HTML, then invalidate the CDN, and only then prune old hashed assets.
# =============================================================================
name: deploy-environment

on:
  workflow_call:
    inputs:
      environment:
        description: "dev | qa | prod"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    env:
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-deploy-${{ inputs.environment }}-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload hashed assets
        run: |
          aws s3 sync dist/_astro "s3://${S3_BUCKET}/_astro" \
            --cache-control "public, max-age=31536000, immutable" \
            --only-show-errors

      - name: Upload HTML and other files
        run: |
          aws s3 sync dist "s3://${S3_BUCKET}" \
            --exclude "_astro/*" \
            --delete \
            --cache-control "public, max-age=0, s-maxage=86400, must-revalidate" \
            --only-show-errors

      - name: Invalidate CloudFront
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "${DISTRIBUTION_ID}" \
            --id "${INVALIDATION_ID}"

      - name: Prune old hashed assets
        run: |
          aws s3 sync dist/_astro "s3://${S3_BUCKET}/_astro" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --only-show-errors
